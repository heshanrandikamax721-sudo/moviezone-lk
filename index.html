<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MovieZone LK</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>🎬 MovieZone <span>LK</span></b><nav><a href="index.html">Home</a><a href="#movies">Movies</a><a href="admin.html">Add Movie</a></nav></header>
<section class="hero"><h1>Discover Your<br>Next Movie</h1><button onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})">Explore Movies</button></section>
<section class="search"><input id="search" placeholder="🔎 Search movie..."></section>
<section><h2>Categories</h2><div class="cats"><button onclick="filterMovies('All')">All</button><button onclick="filterMovies('Action')">Action</button><button onclick="filterMovies('Comedy')">Comedy</button><button onclick="filterMovies('Adventure')">Adventure</button><button onclick="filterMovies('Animation')">Animation</button><button onclick="filterMovies('Sinhala Dubbed')">Sinhala Dubbed</button></div></section>
<section id="movies"><div class="row"><h2>🔥 Latest Movies</h2><span id="count"></span></div><div id="grid" class="grid"></div></section><footer>🎬 MovieZone LK</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="movies.js"></script><script>
let cat="All"; const grid=document.getElementById("grid"),search=document.getElementById("search");
async function show(){const {data,error}=await supabaseClient.from("movies").select("*").order("created_at",{ascending:false}); if(error){grid.innerHTML="<p>Database error.</p>";return} const q=search.value.toLowerCase();const a=(data||[]).filter(m=>(m.title||"").toLowerCase().includes(q)&&(cat==="All"||((m.genre||"").split(",").map(x=>x.trim()).includes(cat))));document.getElementById("count").textContent=a.length+" Movies";grid.innerHTML=a.map(m=>`<a class="link" href="movie.html?id=${m.id}"><div class="card"><img src="${m.poster||""}"><div><h3>${m.title}</h3><p>${m.year||""} • ${m.genre||""}</p><b>⭐ ${m.rating||"N/A"}</b></div></div></a>`).join("")}
function filterMovies(x){cat=x;show()} search.oninput=show; show();
</script></body></html>
