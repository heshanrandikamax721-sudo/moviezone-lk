<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MovieZone LK</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>🎬 MovieZone <span>LK</span></b><nav><a href="index.html">Home</a><a href="admin.html">Add Movie</a></nav></header><main id="page"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="movies.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get("id");const {data:m,error}=await supabaseClient.from("movies").select("*").eq("id",id).single();const p=document.getElementById("page");if(error||!m){p.innerHTML="<div class='notfound'><h1>Movie Not Found 😢</h1><a href='index.html'>← Home</a></div>";return}document.title=m.title+" - MovieZone LK";p.innerHTML=`<section class="details"><img src="${m.poster||""}"><div><p class="red">MOVIE DETAILS</p><h1>${m.title}</h1><p>⭐ ${m.rating||"N/A"} • ${m.year||""} • ${m.genre||""}</p><p class="desc">${m.description||""}</p><p>Language: ${m.language||"English"}</p></div></section>${m.trailer?`<section><h2>🎞️ Trailer</h2><div class="video"><iframe src="${m.trailer}" allowfullscreen></iframe></div></section>`:""}`})();
</script></body></html>
