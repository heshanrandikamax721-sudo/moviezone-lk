<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Movie</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>🎬 MovieZone <span>LK</span></b><nav><a href="index.html">Home</a><a href="admin.html">Add Movie</a></nav></header><section class="admin"><h1>➕ Add New Movie</h1><p>Online database demo.</p><form id="form"><input id="title" placeholder="Movie Title" required><input id="year" type="number" placeholder="Year"><input id="rating" type="number" step=".1" placeholder="Rating"><input id="poster" type="url" placeholder="Poster Image URL" required><input id="trailer" type="url" placeholder="YouTube Embed URL (optional)"><select id="genre"><option>Action</option><option>Comedy</option><option>Adventure</option><option>Animation</option><option>Drama</option><option>Sinhala Dubbed</option></select><select id="language"><option>English</option><option>Sinhala Dubbed</option><option>Other</option></select><textarea id="description" placeholder="Description" required></textarea><button>Add Movie</button></form><p id="msg"></p><h2>Online Movies</h2><div id="list"></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="movies.js"></script><script>
const f=document.getElementById("form"),msg=document.getElementById("msg"),list=document.getElementById("list");async function load(){const {data}=await supabaseClient.from("movies").select("*").order("created_at",{ascending:false});list.innerHTML=(data||[]).map(m=>`<div class="item"><span>${m.title}</span><button onclick="del(${m.id})">Delete</button></div>`).join("")||"<p>No movies yet.</p>"}async function del(id){if(!confirm("Delete movie?"))return;const {error}=await supabaseClient.from("movies").delete().eq("id",id);msg.textContent=error?"❌ "+error.message:"✅ Deleted";load()}f.onsubmit=async e=>{e.preventDefault();msg.textContent="Saving...";const {error}=await supabaseClient.from("movies").insert({title:title.value.trim(),year:year.value?+year.value:null,rating:rating.value?+rating.value:null,poster:poster.value.trim(),trailer:trailer.value.trim(),genre:genre.value,language:language.value,description:description.value.trim()});msg.textContent=error?"❌ "+error.message:"✅ Movie saved online!";if(!error)f.reset();load()};load();
</script></body></html>
